  /* ══════════════════════════════════════════════════════════
     CONTRIBUTION GRAPH
  ══════════════════════════════════════════════════════════ */
  function buildGraph(container, graphId, base) {
    const jan1 = new Date(YEAR, 0, 1);
    const dec31 = new Date(YEAR, 11, 31);
    const start = new Date(jan1);
    start.setDate(start.getDate() - start.getDay());
    const end = new Date(dec31);
    end.setDate(end.getDate() + (6 - end.getDay()));

    const cells = [];
    let cols = '';
    let months = '';
    let d = new Date(start);
    let col = 0;

    while (d <= end) {
      let colHTML = '';
      for (let r = 0; r < 7; r++) {
        const cd = new Date(d);
        if (cd.getFullYear() !== YEAR) {
          colHTML += '<div class="cell out"></div>';
        } else {
          const key = dkey(cd);
          colHTML += '<div class="cell" data-date="' + key + '" style="animation-delay:' + (col * 4) + 'ms"></div>';
          cells.push({ key: key, date: new Date(cd), el: null });
          if (cd.getDate() === 1) {
            months += '<span class="gmonth" style="left:' + (col * CELL) + 'px">' + MONTHS[cd.getMonth()] + '</span>';
          }
        }
        d.setDate(d.getDate() + 1);
      }
      cols += '<div class="gcol">' + colHTML + '</div>';
      col++;
    }

    container.innerHTML =
      '<div class="gwrap">' +
        '<div class="gdays"><span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span></div>' +
        '<div class="gbody">' +
          '<div class="gmonths">' + months + '</div>' +
          '<div class="ggrid">' + cols + '</div>' +
        '</div>' +
      '</div>';

    const byKey = {};
    cells.forEach(function (c) { byKey[c.key] = c; });
    const grid = $('.ggrid', container);
    $$('.cell[data-date]', container).forEach(function (el) {
      const c = byKey[el.dataset.date];
      if (c) c.el = el;
    });

    container._cells = cells;
    container._graphId = graphId;
    container._base = base;
    container._painted = false;

    grid.addEventListener('mouseover', function (e) {
      const cell = e.target.closest('.cell[data-date]');
      if (!cell || cell.classList.contains('future')) return;
      const key = cell.dataset.date;
      const dd = parseKey(key);
      const total = get(key);
      const covered = container._graphId === 'all' && !!INSURANCE.covered[key];
      let html = '<div class="tip-title">' + fmtDate(dd) + '</div>' +
        '<div class="tip-sub">' + (total ? plural(total, 'question') : 'nothing logged') + '</div>';
      if (covered) html += '<div class="tip-sub">Grace day · streak protected</div>';
      if (total) {
        html += '<div class="tip-rows">' + SUBJECTS.map(function (s) {
          return '<span class="tip-row"><i style="background:' + s.color + '"></i>' + s.short.charAt(0) + ' ' + get(key, s.id) + '</span>';
        }).join('') + '</div>';
      }
      html += '<div class="tip-hint">' + (key === TKEY ? 'Today · click to edit' : 'Click to edit this day') + '</div>';
      showTip(html, e.clientX, e.clientY);
    });
    grid.addEventListener('mousemove', function (e) {
      if (tipEl.classList.contains('show')) moveTip(e.clientX, e.clientY);
    });
    grid.addEventListener('mouseout', function (e) {
      if (e.target.closest('.cell')) hideTip();
    });
    grid.addEventListener('click', function (e) {
      const cell = e.target.closest('.cell[data-date]');
      if (!cell) return;
      hideTip();
      openEditor(cell.dataset.date);
    });
    grid.addEventListener('keydown', function (e) {
      const cell = e.target.closest('.cell[data-date]');
      if (!cell) return;
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        hideTip();
        openEditor(cell.dataset.date);
      }
    });
  }

  function renderGraphs() {
    const all = [
      { id: 'all', container: REFS.overview.graph },
      { id: 'm', container: REFS.m.graph },
      { id: 'p', container: REFS.p.graph },
      { id: 'c', container: REFS.c.graph }
    ];

    all.forEach(function (g) {
      const container = g.container;
      if (!container || !container._cells) return;
      const base = g.id === 'all' ? ACCENT : SUBJ[g.id].color;
      const target = g.id === 'all' ? GOAL : TARGETS[g.id];

      container._cells.forEach(function (c) {
        if (!c.el) return;
        const v = g.id === 'all' ? get(c.key) : get(c.key, g.id);
        const covered = g.id === 'all' && !!INSURANCE.covered[c.key];
        const color = covered ? ACCENT_SOFT : (v ? mix(base, SHADES[levelFor(v, target)]) : EMPTY);
        if (c.el.dataset.c !== color) {
          c.el.style.background = color;
          if (container._painted && v) {
            c.el.classList.remove('bump');
            void c.el.offsetWidth;
            c.el.classList.add('bump');
          }
        }
        c.el.dataset.c = color;
        c.el.dataset.v = v;
        c.el.classList.toggle('grace', covered);
        c.el.classList.toggle('future', c.date > TODAY);
        c.el.classList.toggle('today', c.key === TKEY);
        c.el.tabIndex = c.key === TKEY ? 0 : -1;
        c.el.setAttribute('role', 'button');
        c.el.setAttribute('aria-label', fmtDate(c.date) + ': ' + plural(v, 'question') +
          (covered ? '. Grace day, streak protected' : '') + '. Open day editor.');
      });
      container._painted = true;
    });
  }

  function bindRankRail(root) {
    const rail = $('.rail', root);
    if (!rail) return;
    rail.addEventListener('mouseover', function (e) {
      const b = e.target.closest('.rail-stop');
      if (!b) return;
      const st = RANK_STOPS[Number(b.dataset.stop)];
      if (!st) return;
      showTip(
        '<div class="tip-title">AIR ' + fmt(st.air) + '</div>' +
        '<div class="tip-sub">' + fmt(st.q) + ' questions</div>' +
        '<div class="tip-hint">' + st.note + '</div>',
        e.clientX, e.clientY
      );
    });
    rail.addEventListener('mousemove', function (e) {
      if (tipEl.classList.contains('show')) moveTip(e.clientX, e.clientY);
    });
    rail.addEventListener('mouseout', function (e) {
      if (e.target.closest('.rail-stop')) hideTip();
    });
  }

  /* ══════════════════════════════════════════════════════════
     RENDER — OVERVIEW
  ══════════════════════════════════════════════════════════ */
  function renderOverview(sums) {
    const r = REFS.overview;
    const all = sums.all;

    r.sub.innerHTML = all.allTime
      ? '<b>' + fmt(all.today) + '</b> of ' + GOAL + ' today · <b>' + fmt(all.allTime) + '</b> solved all-time'
      : 'A quiet start — log your first question.';

    // today cards
    SUBJECTS.forEach(function (s) {
      const d = sums[s.id];
      const t = r.today[s.id];
      animateNum(t.num, d.today);
      animateNum(t.all, d.allTime);
      t.bar.style.width = Math.min(100, (d.today / d.target) * 100) + '%';
      const pct = Math.round((d.today / d.target) * 100);
      t.foot.textContent = pct + '% of daily target';
      t.best.textContent = d.bestDay ? 'best ' + d.bestDay + ' in a day' : 'no best day yet';
    });

    // all-time composition
    animateNum(r.atTotal, all.allTime);
    SUBJECTS.forEach(function (s) {
      const v = sums[s.id].allTime;
      animateNum(r.alltime[s.id], v);
      r.stack[s.id].style.width = (all.allTime ? (v / all.allTime) * 100 : 0) + '%';
    });
    r.atHint.textContent = all.allTime ? (all.firstYear < YEAR ? 'since ' + all.firstYear : 'in ' + YEAR) : 'no entries yet';

    // simulated AIR
    const air = calcAIR(all.allTime);
    const pos = rankPosition(all.allTime);
    animateNum(r.rank.num, air);
    const topPct = (air / RANK_POOL) * 100;
    r.rank.top.textContent = 'top ' + (topPct < 0.1 ? '<0.1' : topPct.toFixed(1)) + '%';
    r.rank.fill.style.width = pos + '%';
    r.rank.pin.style.left = pos + '%';
    r.rank.pin.setAttribute('aria-label', 'AIR ' + fmt(air) + ' at ' + fmt(all.allTime) + ' questions');

    const next = nextMilestone(all.allTime);
    r.rank.note.innerHTML = next
      ? '<b>' + fmt(next.remaining) + '</b> ' + (next.remaining === 1 ? 'question' : 'questions') +
        ' to AIR <b>' + fmt(next.air) + '</b>'
      : '<b>Hard cap reached</b> — AIR 1.';

    // contribution copy
    r.contributed.sub.innerHTML = '<b>' + fmt(all.yearTotal) + '</b> in ' + YEAR +
      ' · <b>' + plural(all.yearActiveDays, 'active day') + '</b>';
    r.contributed.foot.innerHTML = all.allTime
      ? '<b>' + fmt(all.allTime) + '</b> solved all-time · <b>' + fmt(all.bestDay) + '</b> best day'
      : 'Press <b>M</b>, <b>P</b> or <b>C</b> to log your first question';

    renderMetrics(r.metrics, all, ACCENT, 'ov');
    renderRecords(r.records);
  }

  /* ══════════════════════════════════════════════════════════
     RENDER — SUBJECT VIEW
  ══════════════════════════════════════════════════════════ */
  function renderSubject(s, sum) {
    const r = REFS[s.id];
    if (!r) return;

    animateNum(r.today.num, sum.today);
    r.today.bar.style.width = Math.min(100, (sum.today / sum.target) * 100) + '%';
    animateNum(r.alltime, sum.allTime);
    animateNum(r.best, sum.bestStreak);

    r.contributed.sub.innerHTML = '<b>' + fmt(sum.yearTotal) + '</b> in ' + YEAR +
      ' · <b>' + plural(sum.yearActiveDays, 'active day') + '</b>';
    r.contributed.foot.innerHTML = sum.allTime
      ? '<b>' + fmt(sum.allTime) + '</b> solved all-time · <b>' + fmt(sum.bestDay) + '</b> best day'
      : 'No questions logged yet — press <b>' + s.short.charAt(0) + '</b> to start';

    renderMetrics(r.metrics, sum, s.color, s.id);
  }

  /* ══════════════════════════════════════════════════════════
     RENDER — METRICS
  ══════════════════════════════════════════════════════════ */
  function renderMetrics(refs, sum, color, key) {
    /* last 7 days */
    const week = refs.week;
    if (week) {
      animateNum(week.num, sum.weekSum);
      const max = Math.max(1, sum.target, Math.max.apply(null, sum.last7.map(function (d) { return d.value; })));
      week.bars.forEach(function (b, i) {
        const d = sum.last7[i];
        const h = d.value ? Math.max(8, (d.value / max) * 100) : 0;
        b.fill.style.height = h + '%';
        b.fill.style.background = d.value ? mix(color, 0.32 + 0.68 * (d.value / max)) : '';
        b.root.dataset.key = d.key;
        b.root.dataset.v = d.value;
        const lab = b.root.querySelector('em');
        if (lab) lab.textContent = DAYS[d.date.getDay()].charAt(0);
        b.root.setAttribute('aria-label', fmtShort(d.date) + ': ' + plural(d.value, 'question'));
      });
      const diff = sum.weekSum - sum.prevWeekSum;
      let delta;
      if (!sum.prevWeekSum) delta = sum.weekSum ? 'fresh start' : 'nothing yet';
      else {
        const pct = Math.round((diff / sum.prevWeekSum) * 100);
        delta = (pct > 0 ? '+' : '') + pct + '% vs prior week';
      }
      week.foot.textContent = delta;
    }

    /* best streak + current */
    const streak = refs.streak;
    if (streak) {
      animateNum(streak.num, sum.bestStreak);
      streak.pips.forEach(function (p, i) {
        const d = sum.last14[i];
        p.style.setProperty('--c', color);
        p.classList.toggle('on', d.value > 0);
        p.classList.toggle('today', d.key === TKEY);
        p.dataset.key = d.key;
        p.dataset.v = d.value;
        p.setAttribute('aria-label', fmtShort(d.date) + ': ' + plural(d.value, 'question'));
      });
      streak.foot.innerHTML = 'current run <b>' + sum.currentStreak + ' ' +
        (sum.currentStreak === 1 ? 'day' : 'days') + '</b>';
    }

    /* daily average + sparkline */
    const avg = refs.avg;
    if (avg) {
      animateNum(avg.num, sum.avg30, function (v) { return fmt1(v); });
      const vals = sum.spark;
      const w = 160, h = 34;
      const max = Math.max(1, Math.max.apply(null, vals));
      const pts = vals.map(function (v, i) {
        const x = (i / (vals.length - 1)) * w;
        const y = h - 3 - (v / max) * (h - 8);
        return x.toFixed(1) + ',' + y.toFixed(1);
      });
      const gid = 'sg-' + key;
      avg.vis.innerHTML =
        '<div class="spark"><svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-label="Last 30 days">' +
          '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
            '<stop offset="0%" stop-color="' + color + '" stop-opacity=".16"/>' +
            '<stop offset="100%" stop-color="' + color + '" stop-opacity="0"/>' +
          '</linearGradient></defs>' +
          '<polygon points="0,' + h + ' ' + pts.join(' ') + ' ' + w + ',' + h + '" fill="url(#' + gid + ')"/>' +
          '<polyline class="spark-line" points="' + pts.join(' ') + '" fill="none" stroke="' + color +
            '" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
        '</svg></div>';
      avg.foot.innerHTML = 'peak <b>' + fmt(sum.bestDay) + '</b> · ' + fmt(sum.daysActive) + ' active days';
    }

    /* grace bank — overview only */
    if (refs.grace) renderGrace(refs.grace);
  }

  function renderGrace(ref) {
    const ins = INSURANCE;
    animateNum(ref.num, ins.bank);
    ref.shields.forEach(function (sh, i) { sh.classList.toggle('on', i < ins.bank); });
    ref.segs.forEach(function (seg, i) { seg.classList.toggle('on', ins.bank < 2 && i < ins.progress); });

    const toNext = 5 - ins.progress;
    ref.foot.textContent = ins.bank >= 2 ? 'Bank full'
      : (ins.earned === 0 && ins.used === 0 && ins.progress === 0) ? '0 banked'
      : plural(toNext, 'target day') + ' to next';

    if (ref.lastBank !== null && ins.bank > ref.lastBank) {
      const wrap = ref.shields.length ? ref.shields[0].parentNode : null;
      if (wrap) {
        wrap.classList.remove('pop');
        void wrap.offsetWidth;
        wrap.classList.add('pop');
      }
    }
    ref.lastBank = ins.bank;

    const card = ref.num.closest('.metric');
    if (card) {
      const last = Object.keys(ins.covered).sort().pop();
      const lastDate = last ? parseKey(last) : null;
      card.setAttribute('aria-label', 'Grace bank: ' + ins.bank + ' of 2 banked. ' +
        plural(ins.earned, 'token') + ' earned, ' + ins.used + ' used.' +
        (lastDate ? ' Last grace day ' + lastDate.getDate() + ' ' + MONTHS[lastDate.getMonth()] + '.' : ''));
    }
  }

  /* ══════════════════════════════════════════════════════════
     RENDER — PERSONAL RECORDS
  ══════════════════════════════════════════════════════════ */
  function setRecValue(el, value) {
    if (value === null || value === undefined) {
      if (el._raf) { cancelAnimationFrame(el._raf); el._raf = null; }
      el._num = undefined;
      el.textContent = '—';
      return;
    }
    animateNum(el, value);
  }

  function setRec(tile, value, cap, aria) {
    const empty = value === null || value === undefined;
    tile.el.classList.toggle('is-empty', empty);
    setRecValue(tile.value, empty ? null : value);
    tile.cap.textContent = cap;
    tile.el.setAttribute('aria-label', aria);
  }

  function renderRecords(ref) {
    if (!ref) return;
    const r = RECORDS;
    const has = !!(r && r.activeDays);
    const t = ref.tiles;

    const day = r && r.bestDay;
    setRec(t.day, day ? day.value : null, day ? fmtRecDate(day.date) : 'no data yet',
      day ? 'Best day: ' + plural(day.value, 'question') + ' on ' + fmtDate(day.date) + '.'
        : 'Best day: no data yet.');
    if (day) {
      const max = Math.max(1, day.m, day.p, day.c);
      t.day.bars.forEach(function (bar, i) {
        const v = day[SUBJECTS[i].id];
        bar.style.height = v ? Math.max(12, (v / max) * 100) + '%' : '3px';
        bar.style.opacity = v ? '1' : '.3';
      });
    } else {
      t.day.bars.forEach(function (bar) { bar.style.height = '3px'; });
    }

    const week = r && r.bestWeek;
    setRec(t.week, week ? week.value : null, week ? fmtRecRange(week.start, week.end) : 'no data yet',
      week ? 'Best 7 days: ' + plural(week.value, 'question') + ', ' + fmtDate(week.start) +
        ' to ' + fmtDate(week.end) + '.' : 'Best 7 days: no data yet.');
    if (week) {
      const max = Math.max(1, Math.max.apply(null, week.days));
      t.week.bars.forEach(function (bar, i) {
        const v = week.days[i];
        bar.style.height = v ? Math.max(10, (v / max) * 100) + '%' : '3px';
        bar.style.background = v ? mix(ACCENT, 0.24 + 0.76 * (v / max)) : 'var(--soft)';
      });
    } else {
      t.week.bars.forEach(function (bar) {
        bar.style.height = '3px';
        bar.style.background = 'var(--line)';
      });
    }

    const month = r && r.bestMonth;
    setRec(t.month, month ? month.value : null,
      month ? MONTHS_FULL[month.month] + ' ' + month.year : 'no data yet',
      month ? 'Best month: ' + MONTHS_FULL[month.month] + ' ' + month.year + ', ' +
        plural(month.value, 'question') + ' across ' + plural(month.days, 'active day') + '.'
        : 'Best month: no data yet.');
    if (month) {
      const max = Math.max(1, Math.max.apply(null, month.strip));
      t.month.bars.forEach(function (bar, i) {
        const v = month.strip[i];
        bar.style.height = v ? Math.max(8, (v / max) * 100) + '%' : '3px';
        bar.style.background = i === month.month ? ACCENT :
          (v ? mix(ACCENT, 0.10 + 0.36 * (v / max)) : 'var(--line)');
      });
    } else {
      t.month.bars.forEach(function (bar) {
        bar.style.height = '3px';
        bar.style.background = 'var(--line)';
      });
    }

    const active = r ? r.activeDays : 0;
    setRec(t.active, active || null, active ? 'since ' + fmtRecDate(r.first) : 'no data yet',
      active ? 'Days active: ' + plural(active, 'day') + ' with at least one question, since ' +
        fmtDate(r.first) + '.' : 'Days active: no data yet.');
    if (t.active.arc) {
      const c = 2 * Math.PI * 8;
      const pct = active && r.spanDays ? Math.min(1, active / r.spanDays) : 0;
      t.active.arc.style.strokeDashoffset = (c * (1 - pct)).toFixed(2);
    }

    const triple = r && r.triple;
    setRec(t.triple, triple ? triple.days : null,
      triple ? fmtRecRange(triple.start, triple.end) : (has ? 'no triple yet' : 'no data yet'),
      triple ? 'Longest Triple Master streak: ' + plural(triple.days, 'consecutive day') + ', ' +
        fmtDate(triple.start) + ' to ' + fmtDate(triple.end) + '.'
        : 'Longest Triple Master streak: none yet.');

    SUBJECTS.forEach(function (s) {
      const hit = r && r.subject[s.id];
      const tile = t[s.id];
      setRec(tile, hit ? hit.value : null, hit ? fmtRecDate(hit.date) : 'no data yet',
        hit ? 'Highest ' + s.name + ' day: ' + plural(hit.value, 'question') + ' on ' +
          fmtDate(hit.date) + '.' : 'Highest ' + s.name + ' day: no data yet.');
      if (hit) {
        const pct = Math.min(100, (hit.value / (TARGETS[s.id] * 2)) * 100);
        tile.fill.style.width = pct + '%';
        tile.mark.style.left = pct + '%';
      } else {
        tile.fill.style.width = '0%';
        tile.mark.style.left = '0%';
      }
    });
  }

  /* ══════════════════════════════════════════════════════════
     RENDER — ROOT
  ══════════════════════════════════════════════════════════ */
  function render() {
    computeInsurance();
    computeRecords();
    const sums = { all: summarize('all') };
    SUBJECTS.forEach(function (s) { sums[s.id] = summarize(s.id); });
    renderOverview(sums);
    SUBJECTS.forEach(function (s) { renderSubject(s, sums[s.id]); });
    renderGraphs();
    refreshEditorFromStore();
  }

  /* ══════════════════════════════════════════════════════════
     DAY EDITOR
  ══════════════════════════════════════════════════════════ */
  const dayBackdrop = document.getElementById('dayBackdrop');
  const edTitle = document.getElementById('edTitle');
  const edRelative = document.getElementById('edRelative');
  const edRows = document.getElementById('edRows');
  const edTotal = document.getElementById('edTotal');
  let editingKey = null;

  function lockScroll(on) {
    document.body.style.overflow = on ? 'hidden' : '';
  }

  function openEditor(key) {
    if (!key || !/^\d{4}-\d{2}-\d{2}$/.test(key)) return;
    if (key > TKEY) { toast('That day hasn’t happened yet'); return; }
    hideTip();
    closePalette();
    closeHelp();
    editingKey = key;
    const d = parseKey(key);
    edRelative.textContent = key === TKEY ? 'Today' :
      (key === dkey(addDays(TODAY, -1)) ? 'Yesterday' : DAYS_FULL[d.getDay()]);
    edTitle.textContent = d.getDate() + ' ' + MONTHS_FULL[d.getMonth()] + ' ' + d.getFullYear();

    edRows.innerHTML = SUBJECTS.map(function (s) {
      return '<div class="ed-row" style="--c:' + s.color + '">' +
        '<span class="dot"></span>' +
        '<div class="ed-name">' + s.short + '<em>target ' + TARGETS[s.id] + '</em></div>' +
        '<button class="step" data-edit="' + s.id + '" data-delta="-1" aria-label="Remove one ' + s.name + ' question">−</button>' +
        '<input class="ed-input" type="number" min="0" max="999" inputmode="numeric" value="' + get(key, s.id) + '" data-ein="' + s.id + '" aria-label="' + s.name + ' questions">' +
        '<button class="step" data-edit="' + s.id + '" data-delta="1" aria-label="Add one ' + s.name + ' question">+</button>' +
        '<div class="ed-bar"><span data-ebar="' + s.id + '"></span></div>' +
      '</div>';
    }).join('');

    syncEditor();
    dayBackdrop.classList.add('show');
    lockScroll(true);
  }

  function syncEditor() {
    if (!editingKey) return;
    const total = get(editingKey);
    edTotal.innerHTML = '<b>' + total + '</b> / ' + GOAL + ' ' +
      '<span class="ed-pct">' + Math.round((total / GOAL) * 100) + '%</span>';
    SUBJECTS.forEach(function (s) {
      const bar = $('[data-ebar="' + s.id + '"]', edRows);
      if (bar) bar.style.width = Math.min(100, (get(editingKey, s.id) / TARGETS[s.id]) * 100) + '%';
    });
  }

  function refreshEditorFromStore() {
    if (!editingKey) return;
    $$('[data-ein]', edRows).forEach(function (inp) {
      if (document.activeElement !== inp) inp.value = get(editingKey, inp.dataset.ein);
    });
    syncEditor();
  }

  function closeEditor() {
    dayBackdrop.classList.remove('show');
    editingKey = null;
    lockScroll(false);
  }

  edRows.addEventListener('input', function (e) {
    const inp = e.target.closest('[data-ein]');
    if (!inp || !editingKey) return;
    const id = inp.dataset.ein;
    const raw = inp.value === '' ? 0 : inp.value;
    commit(function () { setRaw(editingKey, id, raw); }, { coalesce: 'ed:' + editingKey + ':' + id });
    syncEditor();
  });

  edRows.addEventListener('click', function (e) {
    const b = e.target.closest('[data-edit]');
    if (!b || !editingKey) return;
    const id = b.dataset.edit;
    const next = Math.max(0, get(editingKey, id) + Number(b.dataset.delta));
    commit(function () { setRaw(editingKey, id, next); }, { coalesce: 'ed:' + editingKey + ':' + id });
    const inp = $('[data-ein="' + id + '"]', edRows);
    if (inp) inp.value = next;
    syncEditor();
  });

  edRows.addEventListener('blur', function (e) {
    const inp = e.target.closest('[data-ein]');
    if (inp && inp.value === '') inp.value = '0';
  }, true);

  document.getElementById('edClose').addEventListener('click', closeEditor);
  document.getElementById('edDone').addEventListener('click', closeEditor);
  dayBackdrop.addEventListener('click', function (e) { if (e.target === dayBackdrop) closeEditor(); });

  document.getElementById('edClear').addEventListener('click', function () {
    if (!editingKey) return;
    if (!get(editingKey)) { toast('This day is already empty'); return; }
    commit(function () { delete state.data[editingKey]; });
    $$('[data-ein]', edRows).forEach(function (i) { i.value = '0'; });
    syncEditor();
    toast('Day cleared', { undo: true });
  });

  /* ══════════════════════════════════════════════════════════
     COMMAND PALETTE
  ══════════════════════════════════════════════════════════ */
  const ICONS = {
    grid: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2" y="2" width="5" height="5" rx="1.2"/><rect x="9" y="2" width="5" height="5" rx="1.2"/><rect x="2" y="9" width="5" height="5" rx="1.2"/><rect x="9" y="9" width="5" height="5" rx="1.2"/></svg>',
    plus: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M8 2.5v11M2.5 8h11"/></svg>',
    calendar: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><rect x="2" y="3.5" width="12" height="10.5" rx="2"/><path d="M2 6.5h12M5 1.8v2.8M11 1.8v2.8"/></svg>',
    download: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8M4.5 7.2L8 10.7l3.5-3.5M2.5 13.5h11"/></svg>',
    upload: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11.5V3.5M4.5 6.8L8 3.3l3.5 3.5M2.5 13.5h11"/></svg>',
    trash: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5h11M6 4.5V3h4v1.5M4 4.5l.7 9h6.6l.7-9M6.5 7v4M9.5 7v4"/></svg>',
    keyboard: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><rect x="1.5" y="4" width="13" height="8" rx="2"/><path d="M4 6.5h1M7 6.5h1M10 6.5h1M4 9h1M7 9h2M10 9h2"/></svg>'
  };

  function subjectIcon(s) {
    return '<i class="dot" style="background:' + s.color + ';width:8px;height:8px"></i>';
  }

  const COMMANDS = [
    { group: 'Navigate', label: 'Go to Overview', kbd: '1', icon: ICONS.grid, run: function () { switchView('overview'); } },
    { group: 'Navigate', label: 'Go to Mathematics', kbd: '2', icon: subjectIcon(SUBJ.m), run: function () { switchView('m'); } },
    { group: 'Navigate', label: 'Go to Physics', kbd: '3', icon: subjectIcon(SUBJ.p), run: function () { switchView('p'); } },
    { group: 'Navigate', label: 'Go to Chemistry', kbd: '4', icon: subjectIcon(SUBJ.c), run: function () { switchView('c'); } },
    { group: 'Log', label: 'Add one Mathematics question', kbd: 'M', icon: ICONS.plus, run: function () { adjust('m', 1); } },
    { group: 'Log', label: 'Add one Physics question', kbd: 'P', icon: ICONS.plus, run: function () { adjust('p', 1); } },
    { group: 'Log', label: 'Add one Chemistry question', kbd: 'C', icon: ICONS.plus, run: function () { adjust('c', 1); } },
    { group: 'Log', label: 'Open today’s log', kbd: 'T', icon: ICONS.calendar, run: function () { openEditor(TKEY); } },
    { group: 'Data', label: 'Export data as JSON', icon: ICONS.download, run: exportData },
    { group: 'Data', label: 'Import data from JSON', icon: ICONS.upload, run: function () { document.getElementById('fileInput').click(); } },
    { group: 'Data', label: 'Clear all data', icon: ICONS.trash, run: clearAll },
    { group: 'Help', label: 'Keyboard shortcuts', kbd: '?', icon: ICONS.keyboard, run: openHelp }
  ];

  const paletteBackdrop = document.getElementById('paletteBackdrop');
  const palInput = document.getElementById('palInput');
  const palList = document.getElementById('palList');
  const palState = { items: [], sel: 0 };

  function renderPalette(query) {
    const q = (query || '').trim().toLowerCase();
    const items = COMMANDS.filter(function (c) {
      return !q || (c.label + ' ' + c.group).toLowerCase().indexOf(q) >= 0;
    });
    palState.items = items;
    palState.sel = 0;

    if (!items.length) {
      palList.innerHTML = '<div class="pal-empty">No commands match that.</div>';
      return;
    }

    let html = '';
    let last = '';
    items.forEach(function (c, i) {
      if (c.group !== last) {
        html += '<div class="pal-group">' + c.group + '</div>';
        last = c.group;
      }
      html += '<button class="pal-item' + (i === 0 ? ' sel' : '') + '" data-idx="' + i + '">' +
        '<span class="pal-ico">' + c.icon + '</span>' +
        '<span class="pal-label">' + c.label + '</span>' +
        (c.kbd ? '<span class="pal-kbd"><kbd>' + c.kbd + '</kbd></span>' : '') +
      '</button>';
    });
    palList.innerHTML = html;
  }

  function updatePalSel() {
    const items = $$('.pal-item', palList);
    items.forEach(function (el, i) { el.classList.toggle('sel', i === palState.sel); });
    const cur = items[palState.sel];
    if (cur) cur.scrollIntoView({ block: 'nearest' });
  }

  function runCommand(i) {
    const cmd = palState.items[i];
    if (!cmd) return;
    closePalette();
    cmd.run();
  }

  function openPalette() {
    hideTip();
    closeEditor();
    closeHelp();
    paletteBackdrop.classList.add('show');
    lockScroll(true);
    palInput.value = '';
    renderPalette('');
    setTimeout(function () { palInput.focus(); }, 40);
  }

  function closePalette() {
    paletteBackdrop.classList.remove('show');
    lockScroll(false);
  }

  function togglePalette() {
    if (paletteBackdrop.classList.contains('show')) closePalette();
    else openPalette();
  }

  palInput.addEventListener('input', function () { renderPalette(palInput.value); });

  palInput.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (!palState.items.length) return;
      palState.sel = (palState.sel + 1) % palState.items.length;
      updatePalSel();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (!palState.items.length) return;
      palState.sel = (palState.sel - 1 + palState.items.length) % palState.items.length;
      updatePalSel();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      runCommand(palState.sel);
    }
  });

  palList.addEventListener('click', function (e) {
    const b = e.target.closest('.pal-item');
    if (b) runCommand(Number(b.dataset.idx));
  });

  palList.addEventListener('mouseover', function (e) {
    const b = e.target.closest('.pal-item');
    if (!b) return;
    palState.sel = Number(b.dataset.idx);
    updatePalSel();
  });

  paletteBackdrop.addEventListener('click', function (e) {
    if (e.target === paletteBackdrop) closePalette();
  });

  /* ══════════════════════════════════════════════════════════
     HELP
  ══════════════════════════════════════════════════════════ */
  const helpBackdrop = document.getElementById('helpBackdrop');
  const HELP_ROWS = [
    ['Switch view', ['1', '–', '4']],
    ['Add a question', ['M', 'P', 'C']],
    ['Remove a question', ['⇧', 'M / P / C']],
    ['Open today’s log', ['T']],
    ['Command palette', ['⌘', 'K']],
    ['Undo last change', ['⌘', 'Z']],
    ['Keyboard shortcuts', ['?']],
    ['Close anything', ['esc']]
  ];

  function openHelp() {
    hideTip();
    closeEditor();
    closePalette();
    document.getElementById('helpGrid').innerHTML = HELP_ROWS.map(function (r) {
      return '<div class="help-row"><span>' + r[0] + '</span><span class="keys">' +
        r[1].map(function (k) { return '<kbd>' + k + '</kbd>'; }).join('') + '</span></div>';
    }).join('');
    helpBackdrop.classList.add('show');
    lockScroll(true);
  }

  function closeHelp() {
    helpBackdrop.classList.remove('show');
    lockScroll(false);
  }

  document.getElementById('helpClose').addEventListener('click', closeHelp);
  helpBackdrop.addEventListener('click', function (e) { if (e.target === helpBackdrop) closeHelp(); });

  /* ══════════════════════════════════════════════════════════
     DATA PORTABILITY
  ══════════════════════════════════════════════════════════ */
  function exportData() {
    const payload = {
      app: 'JEE Tracker',
      version: 2,
      exportedAt: new Date().toISOString(),
      data: state.data
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'jee-tracker-' + TKEY + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1200);
    toast('Exported ' + plural(Object.keys(state.data).length, 'day') + ' of data');
  }

  function clearAll() {
    if (!Object.keys(state.data).length) { toast('Everything is already clear'); return; }
    commit(function () { state.data = {}; });
    toast('All data cleared', { undo: true });
  }

  document.getElementById('fileInput').addEventListener('change', function () {
    const input = this;
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
      try {
        const parsed = JSON.parse(String(reader.result));
        const raw = parsed && parsed.data ? parsed.data : parsed;
        const clean = sanitize(raw);
        if (!Object.keys(clean).length) throw new Error('empty');
        commit(function () { state.data = clean; });
        toast('Imported ' + plural(Object.keys(clean).length, 'day') + ' of data', { undo: true });
      } catch (err) {
        toast('That file doesn’t look like JEE Tracker data');
      }
      input.value = '';
    };
    reader.readAsText(file);
  });

  /* ══════════════════════════════════════════════════════════
     EVENTS
  ══════════════════════════════════════════════════════════ */
  function bindEvents() {
    document.addEventListener('click', function (e) {
      const stepBtn = e.target.closest('[data-step]');
      if (stepBtn) {
        e.preventDefault();
        adjust(stepBtn.dataset.step, Number(stepBtn.dataset.delta));
        return;
      }
      const act = e.target.closest('[data-act]');
      if (act) {
        const a = act.dataset.act;
        if (a === 'export') exportData();
        else if (a === 'import') document.getElementById('fileInput').click();
        else if (a === 'shortcuts') openHelp();
        else if (a === 'palette') openPalette();
      }
    });

    document.getElementById('cmdkBtn').addEventListener('click', openPalette);

    /* micro tooltips for week bars and streak ticks */
    document.addEventListener('mouseover', function (e) {
      const item = e.target.closest('.metric-visual .wbar, .metric-visual .pip');
      if (!item || !item.dataset.key) return;
      const date = parseKey(item.dataset.key);
      const v = Number(item.dataset.v) || 0;
      const view = item.closest('.view');
      const vid = view ? view.id.replace('view-', '') : '';
      const label = (vid && vid !== 'overview') ? ' · ' + SUBJ[vid].short : '';
      showTip(
        '<div class="tip-title">' + fmtShort(date) + '</div>' +
        '<div class="tip-sub">' + (v ? plural(v, 'question') + label : 'no questions') + '</div>',
        e.clientX, e.clientY
      );
    });
    document.addEventListener('mousemove', function (e) {
      if (!tipEl.classList.contains('show')) return;
      if (e.target.closest('.metric-visual .wbar, .metric-visual .pip')) moveTip(e.clientX, e.clientY);
    });
    document.addEventListener('mouseout', function (e) {
      if (e.target.closest('.metric-visual .wbar, .metric-visual .pip')) hideTip();
    });

    document.addEventListener('keydown', function (e) {
      const el = document.activeElement;
      const typing = el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);
      const mod = e.metaKey || e.ctrlKey;

      if (mod && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        togglePalette();
        return;
      }
      if (mod && !e.shiftKey && e.key.toLowerCase() === 'z' && !typing) {
        e.preventDefault();
        undo();
        return;
      }
      if (e.key === 'Escape') {
        if (paletteBackdrop.classList.contains('show')) closePalette();
        else if (helpBackdrop.classList.contains('show')) closeHelp();
        else if (editingKey) closeEditor();
        hideTip();
        return;
      }
      if (typing) return;
      if (paletteBackdrop.classList.contains('show') || helpBackdrop.classList.contains('show')) return;

      if (e.key === '?') {
        e.preventDefault();
        openHelp();
        return;
      }
      if ((e.key === 't' || e.key === 'T') && !mod && !e.altKey) {
        e.preventDefault();
        openEditor(TKEY);
        return;
      }
      if (/^[1-4]$/.test(e.key) && !mod && !e.altKey) {
        switchView(VIEWS[Number(e.key) - 1].id);
        return;
      }
      const k = e.key.toLowerCase();
      if ('mpc'.indexOf(k) >= 0 && !mod && !e.altKey) {
        e.preventDefault();
        adjust(k, e.shiftKey ? -1 : 1);
      }
    });

    window.addEventListener('resize', hideTip);
    window.addEventListener('scroll', hideTip, { passive: true });

    /* midnight rollover */
    setInterval(function () {
      const now = midnight(new Date());
      if (dkey(now) === TKEY) return;
      if (now.getFullYear() !== YEAR) { location.reload(); return; }
      TODAY = now;
      TKEY = dkey(TODAY);
      document.getElementById('topDate').textContent =
        DAYS[TODAY.getDay()] + ', ' + TODAY.getDate() + ' ' + MONTHS[TODAY.getMonth()];
      render();
      toast('A new day begins');
    }, 60000);
  }

  /* ══════════════════════════════════════════════════════════
     INIT
  ══════════════════════════════════════════════════════════ */
  function init() {
    loadState();
    buildChrome();
    buildOverview();
    SUBJECTS.forEach(buildSubjectView);
    bindEvents();
    render();

    currentView = '';
    const pref = state.prefs.view;
    switchView((pref && document.getElementById('view-' + pref)) ? pref : 'overview');
  }

  init();
})();
</script>
</body>
</html>
